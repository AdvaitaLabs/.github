<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 620" width="1280" height="620" role="img" aria-label="System architecture: Aegis supports research and decisions across Targa, Molia, Cyta and Vitra. Computational feedback runs from Cyta to Molia; experimental feedback runs from Vitra through Research Memory to Aegis.">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.8 L9.5 5 L0 9.2 Z" fill="#7B867F"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.8 L9.5 5 L0 9.2 Z" fill="#3F6B55"/></marker>
  </defs>
  <rect width="1280" height="620" rx="10" fill="#F5F6F1"/>
  <rect x="0.5" y="0.5" width="1279" height="619" rx="10" fill="none" stroke="#0E110F" stroke-opacity="0.12"/>

  <g font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="2.4" fill="#5E6962">
    <text x="64" y="58">ADVAITA LAB</text>
    <text x="1216" y="58" text-anchor="end">SYSTEM</text>
  </g>
  <line x1="64" y1="78" x2="1216" y2="78" stroke="#0E110F" stroke-opacity="0.12"/>
  <text x="64" y="134" font-size="38" fill="#0E110F"><tspan font-family="'Inter Tight', Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="300" letter-spacing="-0.8">Recursive Foundation Model </tspan><tspan font-family="Fraunces, 'Iowan Old Style', Georgia, 'Times New Roman', serif" font-style="italic" font-weight="300" fill="#3F6B55">for Life Science</tspan></text>

  <!-- forward flow -->
  <g fill="none" stroke="#7B867F" stroke-width="1.5">
    <path d="M640 256 V298"/>
    <path d="M184 298 H1096"/>
    <path d="M184 298 V338" marker-end="url(#a)"/>
    <path d="M488 298 V338" marker-end="url(#a)"/>
    <path d="M792 298 V338" marker-end="url(#a)"/>
    <path d="M1096 298 V338" marker-end="url(#a)"/>
    <path d="M304 380 H366" marker-end="url(#a)"/>
    <path d="M608 380 H670" marker-end="url(#a)"/>
    <path d="M912 380 H974" marker-end="url(#a)"/>
  </g>

  <!-- feedback paths -->
  <g fill="none" stroke="#3F6B55" stroke-width="1.5">
    <path d="M792 420 V454 H488 V423" marker-end="url(#b)"/>
    <path d="M1096 420 V545 H943" marker-end="url(#b)"/>
    <path d="M340 545 H34 V218 H337" marker-end="url(#b)"/>
  </g>
  <g font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="1.6" fill="#3F6B55">
    <text x="640" y="478" text-anchor="middle">COMPUTATIONAL FEEDBACK</text>
    <text x="1080" y="470" text-anchor="end">EXPERIMENTAL</text>
    <text x="1080" y="488" text-anchor="end">FEEDBACK</text>
  </g>

  <!-- nodes -->
  <g fill="#FFFFFF" stroke="#3F6B55" stroke-opacity="0.55">
    <rect x="340" y="180" width="600" height="76" rx="38"/>
    <rect x="64" y="340" width="240" height="80" rx="40"/>
    <rect x="368" y="340" width="240" height="80" rx="40"/>
    <rect x="672" y="340" width="240" height="80" rx="40"/>
    <rect x="976" y="340" width="240" height="80" rx="40"/>
    <rect x="340" y="512" width="600" height="66" rx="33"/>
  </g>
  <g font-family="'Inter Tight', Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="27" font-weight="500" text-anchor="middle" fill="#0E110F">
    <text x="640" y="217">Aegis</text>
    <text x="184" y="378">Targa</text>
    <text x="488" y="378">Molia</text>
    <text x="792" y="378">Cyta</text>
    <text x="1096" y="378">Vitra</text>
    <text x="640" y="554">Research Memory</text>
  </g>
  <g font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.4" text-anchor="middle" fill="#4A544E">
    <text x="640" y="239">RESEARCH &amp; DECISIONS</text>
    <text x="184" y="400">TARGET PREPARATION</text>
    <text x="488" y="400">MOLECULAR DESIGN</text>
    <text x="792" y="400">BIOLOGICAL MODELING</text>
    <text x="1096" y="400">EXPERIMENTAL VALIDATION</text>
  </g>
</svg>
