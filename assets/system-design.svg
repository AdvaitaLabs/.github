<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="736" viewBox="0 0 1200 736" role="img" aria-labelledby="title description">
  <title id="title">System Design</title>
  <desc id="description">System-design diagram: Omea, Aegis, Cyta and Molia above computational and laboratory loops, with research memory and a feedback path.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 7 4 L 0 8 Z" fill="#8fb8a4"/>
    </marker>
  </defs>

  <rect width="1200" height="736" fill="#050a08"/>

  <g font-family="Arial, Helvetica, sans-serif" fill="#eeeee6">
    <text x="64" y="66" font-size="31" font-weight="500">System Design</text>

    <g text-anchor="middle">
      <g font-size="35" font-weight="500">
        <text x="188" y="202">Omea</text>
        <text x="464" y="202">Aegis</text>
        <text x="740" y="202">Cyta</text>
        <text x="1016" y="202">Molia</text>
      </g>
      <g font-size="20" fill="#cad8ce">
        <text x="188" y="240">Biological Intelligence</text>
        <text x="464" y="240">Auto Research</text>
        <text x="740" y="240">Virtual Cell</text>
        <text x="1016" y="240">Drug Discovery</text>
      </g>
      <g font-size="27" font-weight="400">
        <text x="360" y="462">Computational loop</text>
        <text x="840" y="462">Laboratory loop</text>
        <text x="600" y="626">Research memory</text>
      </g>
    </g>
  </g>

  <g fill="none" stroke="#8fb8a4" stroke-width="1.6" stroke-linecap="square" stroke-linejoin="miter" opacity="0.8">
    <path d="M 188 272 V 326 H 1016 V 272"/>
    <path d="M 464 272 V 326 M 740 272 V 326"/>
    <path d="M 600 326 V 398" marker-end="url(#arrow)"/>
    <path d="M 360 420 V 398 H 840 V 420"/>

    <path d="M 360 490 V 548 H 840 V 490"/>
    <path d="M 600 548 V 586" marker-end="url(#arrow)"/>

    <path d="M 600 654 V 684 H 48 V 116 H 1144" marker-end="url(#arrow)"/>
  </g>
</svg>
